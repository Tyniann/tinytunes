name: tinytunes
description: "Local-first Android music player with optional BYO Google Drive (read-only)."
publish_to: 'none'
version: 0.8.0+9

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State / DI — pinned with riverpod_generator 4.0.3 (analyzer ^9) for Freezed 3.2.5
  flutter_riverpod: 3.3.1
  riverpod: 3.2.1
  riverpod_annotation: 4.0.2

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Nav
  go_router: ^17.3.0

  # Data — 2.34.0 pairs with freezed 3.2.x via analyzer override below
  drift: 2.34.0
  drift_flutter: 0.3.1
  # Bundles libsqlite3.so into the APK (0.6.0+eol is empty; see overrides).
  sqlite3_flutter_libs: 0.5.39

  # Audio
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  audio_service: 0.18.19

  # Files
  file_picker: ^11.0.2
  permission_handler: ^12.0.3
  path: ^1.9.1
  path_provider: ^2.1.6
  collection: ^1.19.1

  # Metadata (read-only tags + cover art)
  audiotags: ^1.4.5

  # UX / prefs / i18n
  toastification: ^3.2.0
  shared_preferences: ^2.5.5
  # Pinned by flutter_localizations from the Flutter SDK.
  intl: 0.20.2
  package_info_plus: ^9.0.1
  volume_controller: ^3.5.0
  google_sign_in: 7.2.0
  googleapis: 16.0.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.10.4
  # 4.0.4 requires analyzer ^12; freezed 3.2.5 requires analyzer <11 — pin 4.0.3.
  riverpod_generator: 4.0.3
  freezed: 3.2.5
  json_serializable: ^6.11.2
  drift_dev: 2.34.0
  go_router_builder: ^4.1.3
  flutter_launcher_icons: ^0.14.4

# Resolution notes for Flutter 3.41.2 / Dart 3.11.0:
# - audiotags 1.4.5 constrains freezed_annotation ^2.4.x; Riverpod 3 / Freezed 3 need ^3.x.
# - freezed 3.2.5 needs analyzer >=9 <11; riverpod_generator 4.0.3 accepts ^9.
#   analyzer 10.0.1 is the shared pin (do not bump to 12 while freezed stays <11).
dependency_overrides:
  freezed_annotation: ^3.1.0
  analyzer: 10.0.1
  # riverpod_generator pulls mockito ^5.4.4 → resolves to 5.7.0 (analyzer ^13).
  # Pin 5.6.3 so the build script compiles against analyzer 10.
  mockito: 5.6.3
  # drift_flutter 0.3.1 wants ^0.6.0+eol which no longer ships native SQLite.
  # Keep 0.5.39 so Android APKs include libsqlite3.so for sqlite3 3.x system load.
  sqlite3_flutter_libs: 0.5.39

# sqlite3 3.x hooks currently emit NativeAssetsManifest "absolute" without
# packaging the .so into jniLibs on this Flutter/tooling combo. Load the copy
# bundled by sqlite3_flutter_libs 0.5.39 on Android (`libsqlite3.so`).
# On Windows host tests, use the OS `winsqlite3.dll` (no separate sqlite3.dll).
hooks:
  user_defines:
    sqlite3:
      source: system
      name: sqlite3
      name_windows: winsqlite3

# Generates Android mipmaps / adaptive icons from assets/branding/tinytunes_logo.png.
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/tinytunes_logo.png
  adaptive_icon_background: "#F7F1E8"
  adaptive_icon_foreground: assets/branding/tinytunes_logo.png
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/google_drive_icon.png
    - assets/branding/google_g_logo.png
    - assets/branding/tinytunes_logo.png
    - docs/CHANGELOG.md

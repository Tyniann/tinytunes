name: tinytunes
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State / DI
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.2

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Nav
  go_router: ^17.3.0

  # Data — 2.34.0 pairs with freezed 3.2.x via analyzer override below
  drift: 2.34.0
  drift_flutter: 0.3.1

  # Audio
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  just_audio_background: ^0.0.1-beta.17

  # Files
  file_picker: ^11.0.2
  permission_handler: ^12.0.3
  path: ^1.9.1
  path_provider: ^2.1.6
  collection: ^1.19.1

  # Metadata (read-only tags + cover art)
  audiotags: ^1.4.5

  # UX / prefs / i18n
  toastification: ^3.2.0
  shared_preferences: ^2.5.5
  # Pinned by flutter_localizations from the Flutter SDK.
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.10.4
  riverpod_generator: ^4.0.2
  freezed: 3.2.5
  json_serializable: ^6.11.2
  drift_dev: 2.34.0
  go_router_builder: ^4.1.3

# Resolution notes for Flutter 3.41.2 / Dart 3.11.0:
# - audiotags 1.4.5 constrains freezed_annotation ^2.4.x; Riverpod 3 / Freezed 3 need ^3.x.
# - freezed 3.2.5, drift_dev 2.34.0, and riverpod_generator 4.x disagree on analyzer;
#   pin analyzer 10.0.1 so the codegen stack resolves together.
dependency_overrides:
  freezed_annotation: ^3.1.0
  analyzer: 10.0.1

flutter:
  generate: true
  uses-material-design: true
